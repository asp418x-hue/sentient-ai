name: CI & Security Scan

on:
    push:
          branches: [ main, master ]
            pull_request:
                  branches: [ main, master ]

                  jobs:
                      build-and-test:
                            name: Build & Vulnerability Check
                                runs-on: ubuntu-latest

                                    steps:
                                            - name: Checkout Code
                                                    uses: actions/checkout@v4

                                                          - name: Set up Go
                                                                  uses: actions/setup-go@v5
                                                                          with:
                                                                                      go-version: '1.22'
                                                                                                cache: true

                                                                                                      - name: Install CGo Dependencies (Leptonica & Tesseract)
                                                                                                              run: |
                                                                                                                          sudo apt-get update
                                                                                                                                    sudo apt-get install -y \
                                                                                                                                                libtesseract-dev \
                                                                                                                                                            libleptonica-dev \
                                                                                                                                                                        tesseract-ocr-eng

                                                                                                                                                                              - name: Install Dependencies
                                                                                                                                                                                      run: go mod download

                                                                                                                                                                                            - name: Verify Go Module Tidy
                                                                                                                                                                                                    run: |
                                                                                                                                                                                                                go mod tidy
                                                                                                                                                                                                                          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is not tidy" && exit 1)

                                                                                                                                                                                                                                - name: Run Vulnerability Scanner (govulncheck)
                                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                                    go install golang.org/x/vuln/cmd/govulncheck@latest
                                                                                                                                                                                                                                                              govulncheck ./...

                                                                                                                                                                                                                                                                    - name: Build Library Target (lexmatch)
                                                                                                                                                                                                                                                                            run: CGO_ENABLED=1 go build -v ./lexmatch/...

                                                                                                                                                                                                                                                                                  - name: Build TUI Target (cmd/tui)
                                                                                                                                                                                                                                                                                          run: CGO_ENABLED=1 go build -o bin/tui ./cmd/tui

                                                                                                                                                                                                                                                                                                - name: Run Tests
                                                                                                                                                                                                                                                                                                        run: CGO_ENABLED=1 go test -v ./...

